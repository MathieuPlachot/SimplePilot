name: PR Checks

on:
  pull_request:
    branches: [ main ]

jobs:
  flutter-checks:
    name: Flutter Lint, Format, Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: FlutterPilot/flutter_pilot
        run: flutter pub get

      - name: Check formatting
        working-directory: FlutterPilot/flutter_pilot
        run: dart format --output=none --set-exit-if-changed .

      - name: Run analyzer
        working-directory: FlutterPilot/flutter_pilot
        run: flutter analyze

      - name: Run unit tests
        working-directory: FlutterPilot/flutter_pilot
        run: echo 'Re-activate tests (flutter test --no-pub)'
